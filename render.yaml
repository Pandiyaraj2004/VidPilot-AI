# Free API host only. Run the rendering worker on an existing machine with
# Piper, FFmpeg/FFprobe and Chrome installed. No paid service is provisioned.
services:
  - type: web
    name: vidpilot-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: WORKER_ENABLED
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # Set secrets and FRONTEND_URL in the dashboard; see DEPLOYMENT.md.
