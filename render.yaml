# Render.com — VidPilot backend (Web Service)
# Free tier is 512 MB RAM (runtime memory, not disk). node_modules on disk is ~450 MB
# after production prune + cache cleanup (see buildCommand); that does not equal RAM use.
# Remotion + Chrome rendering often needs 1–2 GB+ RAM and may OOM on free tier;
# free tier can reliably run API, scheduler, Telegram/YouTube; use Starter (2 GB+) for renders.
services:
  - type: web
    name: vidpilot-backend
    runtime: node
    rootDir: backend
    plan: free
    # Install all deps for tsc build, then drop devDependencies and Remotion webpack cache (~220 MB saved).
    buildCommand: npm ci && npm run build && npm prune --production && rm -rf node_modules/.cache
    startCommand: node dist/server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: PORT
        value: 4000
      # Set in Render dashboard (never commit secrets):
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY,
      # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      # YOUTUBE_REDIRECT_URI, FRONTEND_URL, PIXABAY_API_KEY, PEXELS_API_KEY, JAMENDO_CLIENT_ID
