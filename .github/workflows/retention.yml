name: Daily owned-media retention
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vidpilot-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake backend and run authenticated retention
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RETENTION_TOKEN: ${{ secrets.RETENTION_TOKEN }}
        run: |
          test -n "$BACKEND_URL" && test -n "$RETENTION_TOKEN"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 20 --max-time 120 \
            -X POST -H "Authorization: Bearer $RETENTION_TOKEN" \
            "$BACKEND_URL/api/maintenance/cleanup"
