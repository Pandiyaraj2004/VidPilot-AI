# Compiles backend/dist for Render free tier (512 MB RAM cannot run tsc — needs ~2 GB).
# On push to main, rebuilds dist and commits it so Render only runs npm ci --omit=dev.
name: Build backend dist for Render

on:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.json"
      - "backend/tsconfig.build.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and compile backend
        working-directory: backend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          npm ci
          npm run build

      - name: Commit dist if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild backend/dist for Render deploy"
          file_pattern: backend/dist/**
          skip_dirty_check: true
